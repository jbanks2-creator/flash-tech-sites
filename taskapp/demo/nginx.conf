server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index site.html;

    # The demo is the product file, opened in ?demo=1 mode. Nothing else is served.
    location = / {
        try_files /site.html =404;
    }

    location / {
        try_files $uri =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;

    # No X-Frame-Options / frame-ancestors on purpose: this file is a public demo and the
    # store page embeds it from a DIFFERENT origin. It writes nothing to storage in demo
    # mode, so being frameable anywhere costs nothing. The real product is served from
    # taskapp-web, which keeps X-Frame-Options: SAMEORIGIN.

    gzip on;
    gzip_types text/html;
    gzip_min_length 1024;
}
