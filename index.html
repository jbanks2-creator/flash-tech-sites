        backedUp ? "pre-import backup downloaded" : "backup could not be downloaded",
      ].filter(Boolean).join(" · ");
      toast(`Imported: ${st.inserted} added, ${st.updated} updated, ${st.skipped} unchanged · ${notes}`);
    } catch (err) { toast("Import failed: " + err.message, true); }
    reset();
  };
  r.readAsText(file);
});
/* Licence key files. In this build `Licence.check` returns {valid:false, reason:"beta"}
   without reading the key, so the flow is exercised end to end but nothing is claimed —
   the commerce build only has to set Licence.verify. */
$("#licenceFile").addEventListener("change", e => {
  const file = e.target.files[0]; if (!file) return;
  const reset = () => { e.target.value = ""; };
  if (file.size > 1048576) { toast("That file is over 1 MB — a licence key is a small JSON or text file.", true); return reset(); }
  const r = new FileReader();
  r.onload = async () => {
    const res = await Licence.check(String(r.result));
    Licence.save({
      status: res.valid ? "active" : "unlicensed", valid: !!res.valid,
      reason: res.valid ? null : (res.reason || "beta"), licensee: res.licensee || null,
      seats: Number.isInteger(res.seats) ? res.seats : null, expires: res.expires || null,
      checked_at: nowUtc(), file: safeName(file.name),
    });
    if ($("#drawer").getAttribute("aria-label") === "Licence") openLicence();
    if (ui.view === "settings") render();
    toast(res.valid
      ? `Licence accepted — ${Licence.label()}`
      : "Key file stored. This beta build does not verify licences, so every feature stays unlocked.");
    reset();
  };
  r.onerror = () => { toast("That key file could not be read", true); reset(); };
  r.readAsText(file);
});
document.addEventListener("keydown", e => {
  const typing = e.target.closest("input,textarea,select");
  if (e.key === "Escape") { if (!$("#drawer").classList.contains("hidden")) tryCloseDrawer(); else if (typing) e.target.blur(); return; }
  if (typing) { if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && ui.drawer) act({task:"saveTask", project:"saveProject", topic:"saveTopic"}[ui.drawer.type]); return; }
  if (e.key === "n") { e.preventDefault(); ui.view === "research" ? openTopic(null) : openTask(null); }
  else if (e.key === "/") { e.preventDefault(); $("#search").focus(); }
  else if (e.key === "q") { e.preventDefault(); $("#quick").focus(); }
  else if (e.key === "t" && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); cycleTheme(); }
  else if (e.key === "?") { e.preventDefault(); openHelp(); }
});

/* ------------------------------------------------------------------ keyboard operability
   P1-3: the board was mouse/touch only. Cards are now focusable buttons; Enter/Space opens
   the task and Ctrl+Arrow moves it between columns (left/right) or reorders it (up/down).
   The drawer traps Tab and Escape still closes it; focus returns to whatever opened it. */
function refocus(sel){ const el = document.querySelector(sel); if (el) { try { el.focus(); } catch (e) {} } }
function reorderCard(t, delta){
  const list = S.tasks.filter(x => x.status === t.status && !x.archived_at).sort((a, b) => a.position - b.position);
  const i = list.findIndex(x => x.id === t.id), j = Math.max(0, Math.min(list.length - 1, i + delta));
  if (i < 0 || i === j) return false;
  list.splice(i, 1); list.splice(j, 0, t);
  list.forEach((x, k) => { x.position = (k + 1) * 1024; });
  t.updated_at = nowUtc();
  return true;
}
function shiftCardStatus(t, dir){
  const i = STATUSES.findIndex(([s]) => s === t.status), j = i + dir;
  if (j < 0 || j >= STATUSES.length) return null;
  setStatus(t, STATUSES[j][0], null);
  return STATUSES[j][1];
}
document.addEventListener("keydown", e => {
  if (!(e.target instanceof Element)) return;
  if (e.target.closest("input,select,textarea,button,a")) return;      // native controls keep their keys
  const card = e.target.closest(".board .card[data-id]");
  const row = e.target.closest("tr.row[data-id], .hrow[data-id]");
  const pcard = e.target.closest(".pcard[data-pid]");
  const rcard = e.target.closest(".rcard[data-rid]");
  if (card) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openTask(card.dataset.id); return; }
    if (e.ctrlKey && e.key.indexOf("Arrow") === 0) {
      e.preventDefault();
      const t = taskById(card.dataset.id); if (!t) return;
      let msg = null;
      if (e.key === "ArrowLeft" || e.key === "ArrowRight") { const to = shiftCardStatus(t, e.key === "ArrowRight" ? 1 : -1); if (!to) return; msg = `Moved to ${to}`; }
      else if (!reorderCard(t, e.key === "ArrowDown" ? 1 : -1)) return;
      commit(msg);
      refocus(`.board .card[data-id="${CSS.escape(card.dataset.id)}"]`);
      return;
    }
  }
  if (row && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openTask(row.dataset.id); return; }
  if (pcard && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openProject(pcard.dataset.pid); return; }
  if (rcard && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openTopic(rcard.dataset.rid); return; }
});
// Keep Tab inside the open drawer.
document.addEventListener("keydown", e => {
  if (e.key !== "Tab") return;
  const d = $("#drawer");
  if (d.classList.contains("hidden")) return;
  const f = $$("button,input,select,textarea,a[href],[tabindex]:not([tabindex='-1'])", d)
    .filter(el => !el.disabled && el.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1], a = document.activeElement;
  if (!d.contains(a)) { e.preventDefault(); first.focus(); return; }
  if (e.shiftKey && a === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && a === last) { e.preventDefault(); first.focus(); }
});
// Roving tabindex on the view tabs.
$("#tabs").addEventListener("keydown", e => {
  if (["ArrowLeft", "ArrowRight", "Home", "End"].indexOf(e.key) < 0) return;
  const tabs = $$("#tabs button"), i = tabs.indexOf(document.activeElement);
  if (i < 0) return;
  e.preventDefault();
  const j = e.key === "Home" ? 0 : e.key === "End" ? tabs.length - 1
    : (i + (e.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length;
  ui.view = tabs[j].dataset.view;
  localStorage.setItem("taskapp.view", ui.view);
  render();
  tabs[j].focus();
});

/* ------------------------------------------------------------------ drag and drop (mouse + touch) */
let drag = null, justDragged = false;
function dragStartCandidate(card, x, y, touch){
  drag = {id:card.dataset.id, card, x0:x, y0:y, started:false, touch, timer:null};
  if (touch) drag.timer = setTimeout(() => { if (drag && !drag.started) { beginDrag(drag.x0, drag.y0); navigator.vibrate?.(15); } }, 260);
}
function beginDrag(x, y){
  const r = drag.card.getBoundingClientRect();
  drag.started = true; drag.dx = x - r.left; drag.dy = y - r.top;
  drag.ghost = drag.card.cloneNode(true); drag.ghost.classList.add("ghost"); drag.ghost.style.width = r.width + "px";
  document.body.appendChild(drag.ghost);
  drag.ph = document.createElement("div"); drag.ph.className = "placeholder"; drag.ph.style.height = r.height + "px";
  drag.card.after(drag.ph); drag.card.style.display = "none";
  document.body.classList.add("dragging");
  moveDrag(x, y);
  requestAnimationFrame(autoScroll);
}
function moveDrag(x, y){
  drag.lx = x; drag.ly = y;
  drag.ghost.style.left = (x - drag.dx) + "px"; drag.ghost.style.top = (y - drag.dy) + "px";
  placePlaceholder(x, y);
}
function placePlaceholder(x, y){
  const el = document.elementFromPoint(x, y), col = el && el.closest(".col");
  if (!col) return;
  const list = $(".list", col), cards = $$(".card", list).filter(c => c !== drag.card);
  const next = cards.find(c => { const r = c.getBoundingClientRect(); return y < r.top + r.height / 2; });
  if (next) { if (drag.ph.nextSibling !== next) list.insertBefore(drag.ph, next); }
  else if (list.lastElementChild !== drag.ph) list.appendChild(drag.ph);
}
// Keeps scrolling while a card is held near the top/bottom edge (needed on phones, where columns are stacked).
function autoScroll(){
  if (!drag || !drag.started) return;
  const edge = 80, y = drag.ly;
  const v = y < edge ? -Math.ceil((edge - y) / 5) : y > innerHeight - edge ? Math.ceil((y - (innerHeight - edge)) / 5) : 0;
  if (v) { const before = scrollY; window.scrollBy(0, v); if (scrollY !== before) placePlaceholder(drag.lx, drag.ly); }
  requestAnimationFrame(autoScroll);
}
function endDrag(){
  if (drag.timer) clearTimeout(drag.timer);
  if (drag.started) {
    const list = drag.ph.parentElement, status = list.closest(".col").dataset.status;
    const index = [...list.children].filter(c => c === drag.ph || (c.classList.contains("card") && c !== drag.card)).indexOf(drag.ph);
    // index counts only visible cards; map to the full column so hidden (filtered) tasks keep their place
    const visibleIds = [...list.children].filter(c => c.classList.contains("card") && c !== drag.card).map(c => c.dataset.id);
    const fullCol = S.tasks.filter(t => t.status === status && t.id !== drag.id && !t.archived_at).sort((a,b) => a.position - b.position);
    let fullIndex = fullCol.length;
    if (index < visibleIds.length) fullIndex = fullCol.findIndex(t => t.id === visibleIds[index]);
    const t = taskById(drag.id), wasStatus = t.status;
    moveTask(drag.id, status, fullIndex);
    drag.ghost.remove(); drag.ph.remove(); document.body.classList.remove("dragging");
    justDragged = true; setTimeout(() => justDragged = false, 50);
    commit(wasStatus !== status ? (status === "completed" ? `Done: ${t.title} ✓` : `Moved to ${STATUS_LABEL[status]}`) : null);
  }
  drag = null;
}
document.addEventListener("mousedown", e => {
  if (e.button !== 0) return;
  const card = e.target.closest(".board .card"); if (!card) return;
  e.preventDefault(); dragStartCandidate(card, e.clientX, e.clientY, false);
});
document.addEventListener("mousemove", e => {
  if (!drag || drag.touch) return;
  if (!drag.started) { if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 5) beginDrag(e.clientX, e.clientY); return; }
  moveDrag(e.clientX, e.clientY);
});
document.addEventListener("mouseup", () => { if (drag && !drag.touch) endDrag(); });
document.addEventListener("touchstart", e => {
  const card = e.target.closest(".board .card"); if (!card || e.touches.length > 1) return;
  const p = e.touches[0]; dragStartCandidate(card, p.clientX, p.clientY, true);
}, {passive:true});
document.addEventListener("touchmove", e => {
  if (!drag || !drag.touch) return;
  const p = e.touches[0];
  if (!drag.started) { if (Math.hypot(p.clientX - drag.x0, p.clientY - drag.y0) > 10) { clearTimeout(drag.timer); drag = null; } return; }
  e.preventDefault(); moveDrag(p.clientX, p.clientY);
}, {passive:false});
document.addEventListener("touchend", () => { if (drag && drag.touch) endDrag(); });
document.addEventListener("touchcancel", () => { if (drag && drag.touch) { if (drag.started) { drag.ghost.remove(); drag.ph.remove(); document.body.classList.remove("dragging"); render(); } clearTimeout(drag.timer); drag = null; } });
document.addEventListener("contextmenu", e => { if (e.target.closest(".board .card")) e.preventDefault(); });

/* ------------------------------------------------------------------ start */
$("#brandVer").textContent = "v" + APP_VERSION;
updateThemeBtn();
render();
if (RECOVERY) showRecoveryBanner(); else backupNudge();
/* First run: an empty board teaches nothing, so ask once — and never again. */
let onboarded = false;
try { onboarded = !!localStorage.getItem("taskapp.onboarded"); } catch (e) {}
if (FIRST_RUN && !RECOVERY && !onboarded) openWelcome();
// refresh due-date labels when the day changes or the tab comes back
let lastDay = todayStr();
setInterval(() => { if (todayStr() !== lastDay) { lastDay = todayStr(); render(); } }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && todayStr() !== lastDay) { lastDay = todayStr(); render(); } });
</script>
</body>
</html>
